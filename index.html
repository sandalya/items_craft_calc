<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Кравецька Майстерня</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kelly+Slab&family=Alegreya+Sans:wght@700;800&display=swap">
<style>
/* Layout: one screenshot-ready board — huge "send to" nick on a red banner, then icon equations: mats + coins = item */
:root{
  --ground:#16110e; --hide:#2a1f18; --iron:#5b4b3e;
  --blood:#9e1b16; --blood-deep:#5e0f0c; --bronze:#c99a4b;
  --bone:#eadfca; --ash:#a8988a; --note:#7fd36b;
  --gold:#e3b23c; --silver:#c9ced6; --copper:#d07a3e;
  --display:"Kelly Slab","Rockwell",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--bone);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.board{max-width:1000px;margin:0 auto;background:radial-gradient(900px 400px at 50% 0,rgba(158,27,22,.18),transparent 70%),#1c1511;border:1px solid var(--iron);border-radius:6px;overflow:hidden}

.to{background:linear-gradient(180deg,var(--blood),var(--blood-deep));border-bottom:4px solid var(--bronze);padding:22px 24px 26px;text-align:center}
.to .lbl{font-family:var(--display);font-size:22px;color:#f6d9b8;display:flex;align-items:center;justify-content:center;gap:10px}
.to .nick{display:inline-block;margin-top:10px;font-family:var(--display);font-size:clamp(40px,9vw,72px);line-height:1;color:#fff4e2;
  padding:12px 28px;border:3px dashed rgba(255,244,226,.55);border-radius:6px;background:rgba(0,0,0,.25);letter-spacing:.03em;max-width:100%;overflow-wrap:anywhere}

section{padding:6px 20px 18px}
h2{font-family:var(--display);font-weight:400;font-size:26px;color:var(--bronze);margin:16px 0 10px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--iron),transparent)}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 280px;align-items:center;gap:12px 16px;padding:12px 16px;background:var(--hide);border:1px solid var(--iron);border-radius:4px}
.mats{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;min-width:0}
.mat{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px}
.mat .top{display:flex;align-items:center;gap:4px}
.mat .n{font-family:var(--display);font-size:24px;color:#ffd84a;line-height:1;font-variant-numeric:tabular-nums}
.mat .cap{font-size:12px;line-height:1.15;text-align:center;color:var(--ash);font-weight:700}
.plus{font-family:var(--display);font-size:30px;color:var(--bronze);align-self:center;padding-bottom:16px}
.op{font-family:var(--display);font-size:40px;color:var(--bronze);line-height:1}
.money{display:flex;align-items:center;gap:10px;align-self:center;padding-bottom:16px}
.coin{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:30px;line-height:1}
.coin svg{width:26px;height:26px}
.item{display:flex;align-items:center;gap:12px;min-width:0}
.name{font-family:var(--display);font-size:22px;line-height:1.1}
.note{margin-top:4px;font-weight:700;font-size:17px;color:var(--ash)}
.note .sl{font-family:var(--display);font-weight:400;font-size:24px;color:var(--note)}
.code{margin-top:8px;display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:28px;line-height:1;letter-spacing:.06em;color:#1a0f08;background:var(--bronze);padding:6px 14px;border-radius:5px;border:2px solid #000}
.code .codelbl{font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:0;text-transform:uppercase;opacity:.75}
.howto{margin:14px 20px 0;padding:12px 16px;background:var(--hide);border:1px dashed var(--bronze);border-radius:4px;font-size:18px;text-align:center}
.howto b{font-family:var(--display);font-weight:400;color:var(--bronze);font-size:22px;letter-spacing:.05em}
.slot{flex:none;border-radius:6px;background:#0d0a08;border:2px solid #000;box-shadow:0 0 0 1px var(--iron),inset 0 0 0 1px rgba(255,255,255,.06);position:relative}
.slot.big{width:68px;height:68px}.slot.sm{width:46px;height:46px}
.slot svg{width:100%;height:100%;display:block}
.wh{color:inherit;text-decoration:none}
.wh:hover{text-decoration:underline}
.slot .wh{display:block;width:100%;height:100%}
.tabs{max-width:1000px;margin:0 auto 12px;display:flex;gap:8px}
.tab{flex:1;font-family:var(--display);font-size:20px;padding:10px;background:var(--hide);color:var(--ash);border:1px solid var(--iron);border-radius:6px;cursor:pointer}
.tab[aria-selected=true]{background:var(--blood-deep);color:#fff4e2;border-color:var(--bronze)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;background:var(--hide);border:1px solid var(--iron);border-radius:4px}
.pick.on{border-color:var(--bronze)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;font-family:var(--display);font-size:24px;line-height:1;background:#0d0a08;color:var(--bronze);border:2px solid var(--iron);border-radius:6px;cursor:pointer}
.qty button:disabled{opacity:.35;cursor:default}
.qty input{width:60px;height:42px;text-align:center;font-family:var(--display);font-size:22px;background:#0d0a08;color:var(--bone);border:2px solid var(--iron);border-radius:6px;-moz-appearance:textfield;appearance:textfield}
.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pick.on .qty input{border-color:var(--bronze);color:#ffd84a}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-top:1px solid var(--iron)}
#pickList{padding-bottom:84px}
.fab{position:fixed;z-index:10;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));box-shadow:0 4px 18px rgba(0,0,0,.7)}
.btn{font-family:var(--display);font-size:22px;padding:12px 28px;color:#fff4e2;background:linear-gradient(180deg,var(--blood),var(--blood-deep));border:2px solid var(--bronze);border-radius:6px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--hide);color:var(--bronze)}
.res{padding:6px 20px 18px}
.res .mats{gap:14px 16px;margin:6px 0 4px}
.res .total{display:flex;align-items:center;gap:12px;margin:8px 0}
.res .total .money,.res .total .plus{padding-bottom:0}
.lines{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:18px}
.lines b{font-family:var(--display);font-weight:400;color:var(--bronze)}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.codebox .code{margin-top:0;font-size:30px;overflow-wrap:anywhere}
@media (max-width:760px){
  .row{grid-template-columns:1fr}
  .op{display:none}
  .item{order:-1;padding-bottom:8px;border-bottom:1px solid var(--iron)}
}
</style>

<nav class="tabs" role="tablist">
  <button class="tab" id="t-order" role="tab" aria-selected="true" type="button">Замовлення</button>
  <button class="tab" id="t-recipes" role="tab" aria-selected="false" type="button">Рецепти</button>
</nav>

<div class="board" id="v-order">
  <div id="pickView">

    <div id="pickList"></div>
    <button class="btn fab" id="gen" type="button" disabled>Сформувати</button>
  </div>
  <div id="resView" hidden>
    <header class="to">
      <div class="lbl"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="2" fill="#f6d9b8"/><path d="M2 3l13 10L28 3" fill="none" stroke="#5e0f0c" stroke-width="2.5"/></svg>Надіслати поштою на</div>

    </header>
    <div class="res" id="resBody"></div>
    <div class="bar"><button class="btn ghost" id="back" type="button">Назад</button></div>
  </div>
</div>

<div class="board" id="v-recipes" hidden>
  <header class="to">
    <div class="lbl"><svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="2" fill="#f6d9b8"/><path d="M2 3l13 10L28 3" fill="none" stroke="#5e0f0c" stroke-width="2.5"/></svg>Надіслати поштою на</div>
    <div class="nick" id="nick"></div>

  <div class="howto">У темі листа напиши <b>код</b> сумки, можна кілька: <b>TA01 TA03</b>. Більше копій — повтори код: <b>TA01 TA01</b></div>
  <div id="sections"></div>
</div>

  leather:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M14 16q8 4 12-2q10 4 20 0q4 6 12 2q-2 10 2 16q-6 6-2 16q-8-2-12 6q-10-4-20 0q-4-8-12-6q4-10-2-16q4-6 2-16z" fill="${c}" stroke="${K}" stroke-width="2.5"/><path d="M26 30q10 6 20 0M24 42q12 6 24 0" stroke="#000" stroke-opacity=".25" stroke-width="2" fill="none"/>`,
  scale:c=>`<rect width="72" height="72" fill="#2e2620"/>${[[22,26],[44,26],[33,40],[22,54],[44,54]].map(([x,y])=>`<path d="M${x-12} ${y}q12-16 24 0q-12 12-24 0z" fill="${c}" stroke="${K}" stroke-width="2"/>`).join("")}`,
  vial:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M30 10h12v6h-2v12l12 20q3 10-8 12H28q-11-2-8-12l12-20V16h-2z" fill="#e8eef0" fill-opacity=".85" stroke="${K}" stroke-width="2.5"/><path d="M24 46h24l3 4q2 7-7 8H28q-9-1-7-8z" fill="${c}"/><rect x="30" y="6" width="12" height="6" rx="1" fill="#8a5a32" stroke="${K}" stroke-width="2"/>`,
  dust:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M14 56q22-26 44 0z" fill="${c}" stroke="${K}" stroke-width="2"/>${[[24,30],[40,22],[50,36],[30,42],[46,48]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${c}"/>`).join("")}`,
  crystal:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M36 8l16 20-16 36-16-36z" fill="${c}" stroke="${K}" stroke-width="2.5"/><path d="M20 28h32M36 8v56" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>`,
  orb:c=>`<rect width="72" height="72" fill="#2e2620"/><circle cx="36" cy="38" r="20" fill="${c}" stroke="${K}" stroke-width="2.5"/><path d="M36 22q10 10 0 22q-8-8 0-22z" fill="#ffe08a"/><circle cx="29" cy="31" r="4" fill="#fff" opacity=".5"/>`,
  stone:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M18 20l20-8 18 12-2 28-20 10-16-14z" fill="${c}" stroke="${K}" stroke-width="2.5"/><path d="M30 28l10 6-6 10 10 6" stroke="#c8a0ff" stroke-width="3" fill="none"/>`,
  spool:c=>`<rect width="72" height="72" fill="#2e2620"/><rect x="16" y="12" width="40" height="8" rx="2" fill="#8a5a32" stroke="${K}" stroke-width="2"/><rect x="16" y="52" width="40" height="8" rx="2" fill="#8a5a32" stroke="${K}" stroke-width="2"/><rect x="20" y="20" width="32" height="32" fill="${c}" stroke="${K}" stroke-width="2"/>${[25,30,35,40,45].map(y=>`<path d="M20 ${y}h32" stroke="#000" stroke-opacity=".25"/>`).join("")}`,
  herb:c=>`<rect width="72" height="72" fill="#2e2620"/><path d="M36 64V30" stroke="#4f8a3a" stroke-width="4"/><path d="M36 50q-14-2-16-14q14 0 16 14zM36 44q14-2 16-14q-14 0-16 14z" fill="#5aa04a" stroke="${K}" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<ellipse cx="36" cy="18" rx="5" ry="9" fill="${c}" stroke="${K}" stroke-width="1.5" transform="rotate(${a} 36 26)"/>`).join("")}<circle cx="36" cy="26" r="4" fill="#ffe36a"/>`,
};
const icon = m => m.img
  ? `<img src="${m.img}" alt="" style="width:100%;height:100%;display:block;border-radius:4px">`
  : `<svg viewBox="0 0 72 72" aria-hidden="true">${ICON[m.kind](m.c)}</svg>`;

// Коди рецептів: TA + номер за порядком у списку. УВАГА: коди постійні — нові сумки додавай ТІЛЬКИ в кінець останньої секції, нічого не вставляй всередину.
let _n = 0;
// Справжні іконки з Wowhead (icons/<ключ>.jpg). Нема файлу = лишається намальована SVG.
Object.keys(MAT).forEach(k => { if(!MAT[k].img) MAT[k].img = `icons/${k}.jpg`; });
// item ID сумок -> icons/bag_<id>.jpg. Felblood Soul Bag не тут: його іконка збігається з Core Felcloth Bag, тому лишається намальована.
const BAG_ID = {  // = Wowhead item ID (https://www.wowhead.com/forever/item=ID). Матеріали: поле id у MAT. Нема id = без посилання
  "Linen Bag":4238,"Red Linen Bag":5762,"Woolen Bag":4240,"Green Woolen Bag":4241,"Red Woolen Bag":5763,
  "Small Silk Pack":4245,"Green Silk Pack":5764,"Black Silk Pack":5765,"Mageweave Bag":10050,"Red Mageweave Bag":10051,
  "Runecloth Bag":14046,"Mooncloth Bag":14155,"Bottomless Bag":14156,
  // Reagent-сумки: у Forever офіційна іконка скрізь одна заглушка, тому ID тут справжні, а картинки підібрані зелені за тіром (не офіційні)
  "Linen Reagent Bag":253664,"Woolen Reagent Bag":253667,"Silk Reagent Bag":253973,"Mageweave Reagent Bag":254035,
  "Runecloth Reagent Bag":254079,"Mooncloth Reagent Bag":254133,"Bottomless Reagent Bag":254139,
  "Enchanted Mageweave Pouch":22246,"Enchanted Runecloth Bag":22248,"Big Bag of Enchantment":22249,"Cenarion Herb Bag":22251,
  "Satchel of Cenarius":22252,"Soul Pouch":21340,"Felcloth Bag":21341,"Core Felcloth Bag":21342};
SECTIONS.forEach(s => s.items.forEach(it => { it.code = "TA" + String(++_n).padStart(2,"0"); it.id = BAG_ID[it.name]; if(it.id) it.img = `icons/bag_${it.id}.jpg`; }));
const slotsNote = t => t.replace(/(\d+)\s+(слот\S*)/, '<b class="sl">$1 $2</b>');

const coinSvg = f => `<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="${f}" stroke="#000" stroke-width="2"/><circle cx="15" cy="15" r="7" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="2"/><circle cx="11" cy="11" r="3" fill="#fff" opacity=".35"/></svg>`;
function coins(c){
  const g=Math.floor(c/10000), s=Math.floor(c%10000/100), cp=c%100, out=[];
  if(g) out.push(`<span class="coin">${g}${coinSvg("var(--gold)")}</span>`);
  if(s) out.push(`<span class="coin">${s}${coinSvg("var(--silver)")}</span>`);
  if(cp||!out.length) out.push(`<span class="coin">${cp}${coinSvg("var(--copper)")}</span>`);
  return `<span class="money">${out.join("")}</span>`;
}

const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const wh = (id,name,inner) => id ? `<a class="wh" href="https://www.wowhead.com/forever/item=${id}/${slug(name)}" target="_blank" rel="noopener">${inner}</a>` : inner;
const row = it => {
  const mats = Object.entries(it.mats).map(([k,n])=>{const m=MAT[k];return `
    <div class="mat"><div class="top"><span class="n">${n}×</span></div><span class="slot sm">${wh(m.id,m.cap,icon(m))}</span><span class="cap">${wh(m.id,m.cap,m.cap)}</span></div>`}).join("");
  return `<div class="row">
    <div class="mats">${mats}<span class="plus">+</span>${coins(it.v+MAIL)}</div>
    <span class="op">=</span>
    <div class="item"><span class="slot big">${wh(it.id,it.name,it.img ? `<img src="${it.img}" alt="" style="width:100%;height:100%;display:block;border-radius:4px">` : bag(it.c,it.e))}</span>
      <div style="min-width:0"><div class="name">${wh(it.id,it.name,it.name)}</div><div class="note">${slotsNote(it.note)}</div><div class="code"><span class="codelbl">Код:</span> ${it.code}</div></div></div>
  </div>`;
};

document.getElementById("nick").textContent = NICK;
document.getElementById("nick2").textContent = NICK;

// ===================== Order tab =====================
const $ = id => document.getElementById(id);
const ALL = SECTIONS.flatMap(s => s.items);
const qty = {};                                   // code -> bags wanted
const thumb = it => it.img ? `<img src="${it.img}" alt="" style="width:100%;height:100%;display:block;border-radius:4px">` : bag(it.c,it.e);

const pickRow = it => `<div class="pick" data-code="${it.code}">
  <div class="item"><span class="slot big">${wh(it.id,it.name,thumb(it))}</span>
    <div style="min-width:0"><div class="name">${wh(it.id,it.name,it.name)}</div><div class="note">${slotsNote(it.note)}</div></div></div>
  <div class="qty"><button type="button" data-d="-1" aria-label="Менше" disabled>−</button><input type="number" min="0" max="999" inputmode="numeric" value="0" aria-label="${it.name}: кількість"><button type="button" data-d="1" aria-label="Більше">+</button></div>
</div>`;
$("pickList").innerHTML = SECTIONS.map(s => `<section><h2>${s.title}</h2><div class="rows">${s.items.map(pickRow).join("")}</div></section>`).join("");

function setQty(code, v, normalize){
  v = Math.max(0, Math.min(999, parseInt(v,10) || 0));
  qty[code] = v;
  const row = $("pickList").querySelector(`[data-code="${code}"]`);
  row.classList.toggle("on", v > 0);
  row.querySelector('[data-d="-1"]').disabled = v === 0;
  if(normalize) row.querySelector("input").value = v;
  const n = ALL.reduce((a,it) => a + (qty[it.code]||0), 0);
  $("gen").textContent = n ? `Сформувати (${n})` : "Сформувати";
  $("gen").disabled = n === 0;
}
$("pickList").addEventListener("click", e => {
  const b = e.target.closest("button[data-d]"); if(!b) return;
  const row = b.closest(".pick"), code = row.dataset.code;
  setQty(code, (qty[code]||0) + +b.dataset.d, true);
});
$("pickList").addEventListener("input", e => setQty(e.target.closest(".pick").dataset.code, e.target.value, false));
$("pickList").addEventListener("change", e => setQty(e.target.closest(".pick").dataset.code, e.target.value, true));

function showResult(){
  const chosen = ALL.filter(it => qty[it.code] > 0);
  const tot = {}; let copper = 0;
  chosen.forEach(it => {
    const c = qty[it.code];
    Object.entries(it.mats).forEach(([k,n]) => tot[k] = (tot[k]||0) + n*c);
    copper += (it.v + MAIL) * c;
  });
  const mats = Object.keys(MAT).filter(k => tot[k]).map(k => `
    <div class="mat"><div class="top"><span class="n">${tot[k]}×</span></div><span class="slot sm">${wh(MAT[k].id,MAT[k].cap,icon(MAT[k]))}</span><span class="cap">${wh(MAT[k].id,MAT[k].cap,MAT[k].cap)}</span></div>`).join("");
  const lines = chosen.map(it => `<li><b>${wh(it.id,it.name,it.name)}</b> ×${qty[it.code]} — ${it.code}</li>`).join("");
  const codes = chosen.flatMap(it => Array(qty[it.code]).fill(it.code)).join(" ");
  $("resBody").innerHTML = `
    <h2>Що надіслати</h2>
    <div class="mats">${mats}</div>
    ${copper ? `<div class="total"><span class="plus">+</span>${coins(copper)}</div>` : ""}
    <h2>Тема листа</h2>
    <div class="codebox"><div class="code"><span class="codelbl">Код:</span> <span id="codeText">${codes}</span></div><button class="btn" id="copy" type="button">Копіювати</button></div>
    <h2>Твоє замовлення</h2>
    <ul class="lines">${lines}</ul>`;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(codes); $("copy").textContent = "Скопійовано"; }
    catch { const r = document.createRange(); r.selectNodeContents($("codeText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  $("pickView").hidden = true; $("resView").hidden = false; scrollTo(0,0);
}
$("gen").onclick = showResult;
$("back").onclick = () => { $("resView").hidden = true; $("pickView").hidden = false; scrollTo(0,0); };

function tab(which){
  $("v-order").hidden = which !== "order"; $("v-recipes").hidden = which !== "recipes";
  $("t-order").setAttribute("aria-selected", which === "order"); $("t-recipes").setAttribute("aria-selected", which === "recipes");
}
$("t-order").onclick = () => tab("order"); $("t-recipes").onclick = () => tab("recipes");
document.getElementById("sections").innerHTML = SECTIONS.map(s=>`
  <section><h2>${s.title}</h2><div class="rows">${s.items.map(row).join("")}</div></section>`).join("");
</script>

</body></html>
